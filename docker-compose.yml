# Tessera: docker compose up -d --build  →  http://localhost:8080
name: tessera

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tessera}
      POSTGRES_USER: ${POSTGRES_USER:-tessera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tessera}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tessera}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD в .env}
      # Адрес для QR-кода на проекторе (например, https://tessera.example.ru). Пусто — адрес из браузера.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Кнопка «Попробовать одному» на главной: 1 — показывать, 0 — скрыть.
      TESSERA_PUBLIC_DEMO: ${TESSERA_PUBLIC_DEMO:-1}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${TESSERA_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
